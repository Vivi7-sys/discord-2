name: Windows Rust Tauri migration (no release)
on:
  push:
    branches: [migration/windows-rust-tauri2]
    paths: ['desktop/transmissor-tauri/**', '.github/workflows/transmissor-rust-windows.yml']
  workflow_dispatch:
    inputs:
      real_session:
        description: 'Optional real WGC + RTP against dedicated D2_TEST_INVITE environment (active receiver required); experimental packaging is independent'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rust-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.ref == 'refs/heads/migration/windows-rust-tauri2'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # Abseil/WebRTC headers exceed MAX_PATH under the checkout's nested target.
      CARGO_TARGET_DIR: D:\d2-target
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: desktop/transmissor-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/transmissor-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/transmissor-tauri/src-tauri -> D:/d2-target
          cache-on-failure: true
      - name: Record Windows x64 build environment
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Windows x64 runner required' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          @{
            os = $os.Caption
            version = $os.Version
            build = $os.BuildNumber
            architecture = $env:PROCESSOR_ARCHITECTURE
            rust = (rustc --version)
            node = (node --version)
            gpu = @(Get-CimInstance Win32_VideoController -ErrorAction SilentlyContinue | Select-Object Name,DriverVersion)
            cpu = @(Get-CimInstance Win32_Processor | Select-Object Name,NumberOfLogicalProcessors)
            physicalWindows11Validation = $false
          } | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 evidence/windows-runner-environment.json
      - name: Frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend build and site identity contract
        run: npm test
      - name: Build bundled frontend
        run: npm run build
      - name: Browser interaction tests (Windows browser, not native WebView)
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
          npm run test:ui
      - name: Rust format, tests, backend HTTP integration and static analysis
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --features desktop --all-targets -- -D warnings
      - name: Build native desktop payload without installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --no-bundle
      - name: Capture actual Windows Tauri window
        continue-on-error: true
        shell: pwsh
        run: ./scripts/windows-screenshot.ps1
      - name: Real WGC, cancellation and static-desktop stop
        if: inputs.real_session == true || vars.D2_RUN_REAL_SESSION == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test windows_capture -- --ignored --nocapture
      - name: Optional real test-room capture and RTP publication
        if: inputs.real_session == true || vars.D2_RUN_REAL_SESSION == 'true'
        env:
          D2_TEST_INVITE: ${{ secrets.D2_TEST_INVITE }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test real_session -- --ignored
      - name: Build experimental installer (physical Windows capture unvalidated)
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Label experimental installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem (Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/release/bundle/nsis/*.exe'))
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          Rename-Item $installers[0].FullName 'Discord2Transmissor-0.2.0-alpha.1-experimental-windows-x64-setup.exe'
      - name: Install, launch and uninstall test package
        shell: pwsh
        run: ./scripts/verify-installer.ps1
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem (Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/release/bundle/nsis/*.exe') | Get-FileHash -Algorithm SHA256 | Format-List | Out-File evidence/installer-sha256.txt
      - name: Mark experimental validation scope
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          @{
            experimental = $true
            physicalWindows11CaptureValidated = $false
            physicalWindows11AudioValidated = $false
            physicalWindows11TransmissionValidated = $false
            workflowRun = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            commit = "${{ github.sha }}"
          } | ConvertTo-Json | Out-File -Encoding utf8 evidence/EXPERIMENTAL-WINDOWS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discord2-rust-windows-evidence-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            desktop/transmissor-tauri/EXPERIMENTAL.txt
            desktop/transmissor-tauri/TESTE-WINDOWS-11.md
            desktop/transmissor-tauri/evidence/
            desktop/transmissor-tauri/playwright-report/
            ${{ env.CARGO_TARGET_DIR }}/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
