name: Windows Rust Tauri migration (no release)
on:
  push:
    branches: [migration/windows-rust-tauri2]
    paths: ['desktop/transmissor-tauri/**', '.github/workflows/transmissor-rust-windows.yml']
  workflow_dispatch:
    inputs:
      real_session:
        description: 'Run real WGC + RTP against dedicated D2_TEST_INVITE environment (active receiver required); build test installer only on success'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rust-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.ref == 'refs/heads/migration/windows-rust-tauri2'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop/transmissor-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/transmissor-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend build and site identity contract
        run: npm test
      - name: Build bundled frontend
        run: npm run build
      - name: Browser interaction tests (Windows browser, not native WebView)
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
          npm run test:ui
      - name: Rust format, tests, backend HTTP integration and static analysis
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --features desktop --all-targets -- -D warnings
      - name: Build native desktop payload without installer
        run: npm run tauri -- build --no-bundle
      - name: Capture actual Windows Tauri window
        continue-on-error: true
        shell: pwsh
        run: ./scripts/windows-screenshot.ps1
      - name: Real WGC, cancellation and static-desktop stop
        if: inputs.real_session == true || vars.D2_RUN_REAL_SESSION == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test windows_capture -- --ignored --nocapture
      - name: Optional real test-room capture and RTP publication
        if: inputs.real_session == true || vars.D2_RUN_REAL_SESSION == 'true'
        env:
          D2_TEST_INVITE: ${{ secrets.D2_TEST_INVITE }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test real_session -- --ignored
      - name: Build experimental installer (physical Windows capture unvalidated)
        run: npm run tauri -- build --bundles nsis
      - name: Install, launch and uninstall test package
        shell: pwsh
        run: ./scripts/verify-installer.ps1
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File evidence/installer-sha256.txt
      - name: Mark experimental validation scope
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          @{
            experimental = $true
            physicalWindows11CaptureValidated = $false
            physicalWindows11AudioValidated = $false
            physicalWindows11TransmissionValidated = $false
            workflowRun = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            commit = "${{ github.sha }}"
          } | ConvertTo-Json | Out-File -Encoding utf8 evidence/EXPERIMENTAL-WINDOWS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discord2-rust-windows-evidence-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            desktop/transmissor-tauri/evidence/
            desktop/transmissor-tauri/playwright-report/
            desktop/transmissor-tauri/src-tauri/target/release/bundle/nsis/*.exe
